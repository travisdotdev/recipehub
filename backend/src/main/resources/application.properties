spring.application.name=csu33012-2425-project19

spring.datasource.url=jdbc:mysql://localhost:3306/recipeHub_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=RandomPassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

spoonacular.api.base-url=https://api.spoonacular.com
